[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pbi-schema-remap"
version = "0.1.0"
description = "Repoint Power BI semantic model sources to a Redshift schema, keeping table names"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pbi-schema-remap = "pbi_schema_remap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
