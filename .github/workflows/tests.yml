name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Run the reference change request end to end
        run: |
          rcm-change run "Add Patient Financial Class to the AR Aging Report" \
            --reason "Needed for payer analysis" --output ./ci-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: change-package-py${{ matrix.python-version }}
          path: ./ci-artifacts/Change_Request
